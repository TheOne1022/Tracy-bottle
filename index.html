<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracy’s Super Smart Bottle - 啟動入口</title>
  <style>
    :root {
      --bg-color: #f7f3ee;
      --card-bg: #ffffff;
      --primary-color: #d4b896;
      --primary-hover: #c4a580;
      --text-color: #5c5248;
      --sub-text: #968a7c;
      --shadow: 0 8px 24px rgba(180, 160, 140, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .welcome-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      max-width: 380px;
      width: 100%;
    }

    .bottle-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 14px;
      color: var(--sub-text);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .launch-btn {
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(212, 184, 150, 0.4);
      transition: background 0.2s, transform 0.1s;
      text-decoration: none;
      display: inline-block;
    }

    .launch-btn:hover {
      background: var(--primary-hover);
    }

    .launch-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <div class="bottle-icon">🥛</div>
    <div class="title">Tracy’s Super Smart Bottle</div>
    <div class="desc">掃描成功！點擊下方按鈕即可直接開啟您的專屬水壺控制介面，調整 8°C 冰水及喜愛的風味。</div>
    
    <!-- 點擊後可開啟控制頁面的按鈕 (若為獨立檔案可連結至主控頁，此處直接觸發互動介面) -->
    <button class="launch-btn" onclick="openControlPanel()">開啟水壺控制中心</button>
  </div>

  <script>
    function openControlPanel() {
      // 這裡直接載入水壺控制介面的完整 HTML 內容，讓您一鍵切換過去
      document.body.innerHTML = `
        <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px; margin: auto;">
          <div style="background: #ffffff; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 8px 24px rgba(180, 160, 140, 0.12);">
            <div style="font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #5c5248;">Tracy’s Super Smart Bottle</div>
            <div style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #968a7c; background: #f0ebe3; padding: 4px 12px; border-radius: 12px;">
              <span style="width: 8px; height: 8px; background-color: #72c07b; border-radius: 50%;"></span> 藍牙已連線 | 電量 85%
            </div>
          </div>

          <div style="background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 8px 24px rgba(180, 160, 140, 0.12);">
            <div style="font-size: 15px; color: #968a7c; margin-bottom: 15px; font-weight: 600;">目標水溫設定</div>
            <div style="text-align: center; margin: 15px 0 25px 0;">
              <span id="tempValue" style="font-size: 56px; font-weight: 800; color: #5c5248; line-height: 1;">8</span><span style="font-size: 24px; font-weight: 500; vertical-align: top;">°C</span>
              <div id="tempDesc" style="font-size: 13px; color: #968a7c; margin-top: 8px;">❄️ 冰爽極限（最低 8°C）</div>
            </div>
            <input type="range" min="8" max="95" value="8" style="width: 100%; height: 8px; border-radius: 5px; background: #ebdcd0; outline: none; -webkit-appearance: none;" oninput="updateTemp(this.value)">
            <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #968a7c;">
              <span>8°C (極冰)</span>
              <span>45°C (溫熱)</span>
              <span>95°C (熱水)</span>
            </div>
          </div>

          <div style="background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 8px 24px rgba(180, 160, 140, 0.12);">
            <div style="font-size: 15px; color: #968a7c; margin-bottom: 15px; font-weight: 600;">風味注入選擇</div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
              <div class="flavor-btn" onclick="selectFlavor(this, '蘋果')" style="background: #faf4ed; border: 2px solid #d4b896; border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;">
                <span style="font-size: 28px;">🍎</span>
                <span style="font-size: 14px; font-weight: 600; color: #5c5248;">蘋果</span>
              </div>
              <div class="flavor-btn" onclick="selectFlavor(this, '蜂蜜')" style="background: #fcfaf7; border: 2px solid #eee8df; border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;">
                <span style="font-size: 28px;">🍯</span>
                <span style="font-size: 14px; font-weight: 600; color: #5c5248;">蜂蜜</span>
              </div>
              <div class="flavor-btn" onclick="selectFlavor(this, '檸檬')" style="background: #fcfaf7; border: 2px solid #eee8df; border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;">
                <span style="font-size: 28px;">🍋</span>
                <span style="font-size: 14px; font-weight: 600; color: #5c5248;">檸檬</span>
              </div>
            </div>
          </div>

          <button onclick="applySettings()" style="background: #d4b896; color: #ffffff; border: none; border-radius: 16px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(212, 184, 150, 0.4);">同步設定至水壺</button>
        </div>
      `;
    }

    function updateTemp(val) {
      document.getElementById('tempValue').innerText = val;
      const desc = document.getElementById('tempDesc');
      if (val == 8) {
        desc.innerText = '❄️ 冰爽極限（最低 8°C）';
      } else if (val < 20) {
        desc.innerText = '🧊 清涼冰水';
      } else if (val <= 40) {
        desc.innerText = '💧 常溫適飲';
      } else if (val <= 60) {
        desc.innerText = '☕ 暖胃溫水';
      } else {
        desc.innerText = '🔥 熱水保溫';
      }
    }

    function selectFlavor(element, flavorName) {
      document.querySelectorAll('.flavor-btn').forEach(btn => {
        btn.style.background = '#fcfaf7';
        btn.style.borderColor = '#eee8df';
      });
      element.style.background = '#faf4ed';
      element.style.borderColor = '#d4b896';
      window.selectedFlavor = flavorName;
    }

    function applySettings() {
      const temp = document.getElementById('tempValue').innerText;
      const flavor = window.selectedFlavor || '蘋果';
      alert(`已將設定發送至 Tracy’s Super Smart Bottle！\n- 設定水溫：${temp}°C\n- 選擇風味：${flavor}`);
    }
  </script>

</body>
</html>
